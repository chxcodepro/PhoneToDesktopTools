# 构建全部可执行文件：电脑端核心（7 个平台）、手机端 APK 和 iOS App（未签名）、电脑端（Windows x64/ia32 安装程序；
# Linux x64/arm64 的 AppImage，以及 x64/arm64/龙芯的 deb 和 tar.gz；Mac Intel / Apple 芯片的 dmg）。
# Mac 版 Core 要调用系统框架（cgo），在 macOS 机器上编译；没有苹果开发者账号，Mac 版只做本地签名（ad-hoc），iOS 版不签名。
# - 每次推送 / PR：测试并构建，产物在 Actions 页面的 Artifacts 里下载（保留 14 天）。
# - 推送 v 开头的标签（如 v0.1.0）：另外创建 GitHub Release 并上传产物。
# 电脑端自己经 USB 连接手机（desktop/core/internal/adbwire），不带 adb；手机端安装包由 apk 任务构建后放进电脑端安装包。
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.20.14' # 最后一个支持 Windows 7 的 Go 版本，不要升级
  NODE_VERSION: '24'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  core:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/core/go.sum
      - name: 测试
        working-directory: desktop/core
        run: |
          go vet ./...
          GOOS=windows go vet ./...   # 同时编译检查 Windows 专用代码和测试
          CGO_ENABLED=0 GOOS=darwin go vet ./...   # Mac 的 Go 代码（cgo 部分在 core-mac 任务里编译）
          go test ./...
      # 龙芯官方的 Go 工具链从国内服务器下载，GitHub 机房下载经常中途断开：缓存起来，只在脚本里的版本变了时才重新下载。
      # 只在下载完整时才保存缓存（restore / save 分开），免得把下了一半的文件存进去
      - uses: actions/cache/restore@v4
        id: loong-cache
        with:
          path: ${{ runner.temp }}/go-loong-ow
          key: go-loong-ow-${{ hashFiles('scripts/fetch-loong-go.sh') }}
      - name: 交叉编译
        id: build-core
        # 龙芯版要用龙芯官方的旧世界 Go 编译（麒麟 V10 的龙芯版是旧世界），见 scripts/build-core.sh 开头。
        # 龙芯服务器下载不了时：正式发版（v* 标签）直接失败；平时的构建跳过龙芯版，其它平台照常出包
        run: |
          if out="$(bash scripts/fetch-loong-go.sh)"; then
            eval "$out"
            echo "loong=1" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            exit 1
          else
            rm -rf "$RUNNER_TEMP/go-loong-ow"
            echo "::warning::龙芯版 Go 工具链下载失败，这次不编译龙芯版（正式发版时必须有）"
          fi
          GO=go bash scripts/build-core.sh "${{ needs.version.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test -x dist/core/linux-loong64/p2d-core; fi
      - uses: actions/cache/save@v4
        if: steps.loong-cache.outputs.cache-hit != 'true' && steps.build-core.outputs.loong == '1'
        with:
          path: ${{ runner.temp }}/go-loong-ow
          key: go-loong-ow-${{ hashFiles('scripts/fetch-loong-go.sh') }}
      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: dist/core/
          retention-days: 14

  core-mac:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/core/go.sum
      - name: 测试（在 Mac 上编译 cgo 代码并运行测试）
        working-directory: desktop/core
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: |
          go vet ./...
          go test ./...
      - name: 编译 Intel 和 Apple 芯片两个版本
        run: |
          GO=go bash scripts/build-core.sh "${{ needs.version.outputs.version }}"
          file dist/core/darwin-amd64/p2d-core dist/core/darwin-arm64/p2d-core
          dist/core/darwin-arm64/p2d-core -version
      - uses: actions/upload-artifact@v4
        with:
          name: core-mac
          path: dist/core/
          retention-days: 14

  ios:
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: 写入版本号和更新地址
        env:
          P2D_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
            j.expo.version = process.env.P2D_VERSION.replace(/-.*$/, "");
            j.expo.ios.buildNumber = String(process.env.GITHUB_RUN_NUMBER);
            j.expo.extra = { ...j.expo.extra, updateRepo: process.env.GITHUB_REPOSITORY };
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2));
          '
      - name: 生成原生工程
        run: npx expo prebuild --platform ios
      - name: 编译（不签名）
        # 没有苹果开发者账号：编出未签名的 .app 打成 ipa，可以用自己的 Apple ID 经 Sideloadly / AltStore 等工具签名安装（见 docs/INSTALL.md）。
        # 有账号后改成签名导出，或用 EAS / TestFlight 发布。
        working-directory: mobile/ios
        run: |
          ws=$(ls -d *.xcworkspace | head -1)
          scheme="${ws%.xcworkspace}"
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -50
          app=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry ../p2d-unsigned.ipa Payload
          ls -la ../p2d-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/p2d-unsigned.ipa
          retention-days: 14

  apk:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - name: 测试
        run: |
          npm run typecheck
          npm test
      - name: 写入版本号和更新地址
        # versionName 用构建版本号（手机「设置 → 关于」显示）；versionCode 用构建序号，保证新包能覆盖安装旧包。
        # updateRepo 是检查更新查询的仓库（GitHub Actions 自带的 GITHUB_REPOSITORY），不写死在代码里。
        env:
          P2D_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
            j.expo.version = process.env.P2D_VERSION;
            j.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            j.expo.extra = { ...j.expo.extra, updateRepo: process.env.GITHUB_REPOSITORY };
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2));
          '
          grep -n '"version"\|versionCode\|updateRepo' app.json
      - name: 生成原生工程
        run: npx expo prebuild --platform android --no-install
      - name: 准备签名证书
        # 配置了仓库 Secrets（见 docs/DEV.md「正式签名」）就用正式证书，否则用调试签名。
        # 电脑端靠覆盖安装给手机更新 App，签名必须和手机上已装的一致，否则手机上会跳过更新。
        env:
          KEYSTORE_BASE64: ${{ secrets.P2D_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "P2D_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "使用正式签名证书"
          else
            sum=$(sha256sum android/app/debug.keystore | cut -d' ' -f1)
            echo "没有配置正式签名，使用调试签名（debug.keystore SHA-256：$sum）"
            if [ "$sum" != "221e0a3106aa4c3ccc154e0a418b55020b3f9ea6e84f92e8749cd9e2f39f5e58" ]; then
              echo "::warning::调试签名证书和本地构建的不同，手机上已装的版本将无法被这个 APK 覆盖更新"
            fi
          fi
      - name: 构建 APK
        working-directory: mobile/android
        env:
          P2D_KEYSTORE_PASSWORD: ${{ secrets.P2D_KEYSTORE_PASSWORD }}
          P2D_KEY_ALIAS: ${{ secrets.P2D_KEY_ALIAS }}
          P2D_KEY_PASSWORD: ${{ secrets.P2D_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --console=plain
      - run: cp android/app/build/outputs/apk/release/app-release.apk ../p2d.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: p2d.apk
          retention-days: 14

  desktop:
    needs: [version, core, core-mac, apk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-15
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: core*
          merge-multiple: true
          path: dist/core
      - name: 恢复可执行权限
        # 上传 / 下载 artifact 会丢掉文件的可执行权限
        run: chmod +x dist/core/*/p2d-core 2>/dev/null || true
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: desktop/vendor/app
      - name: 设置版本号
        working-directory: desktop/app
        # p2d.updateRepo：检查更新查询的仓库，不写死在代码里
        run: |
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm pkg set p2d.updateRepo="$GITHUB_REPOSITORY"
      - run: npm ci
        working-directory: desktop/app
      - name: 类型检查
        working-directory: desktop/app
        run: npm run typecheck
      - name: 打包
        working-directory: desktop/app
        run: npm run dist:${{ matrix.target }} -- --publish never
      - name: 打 deb 包（x64、arm64、龙芯）
        if: matrix.target == 'linux'
        run: bash scripts/package-linux.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/app/release/*.exe
            desktop/app/release/*.AppImage
            desktop/app/release/*.deb
            desktop/app/release/*.tar.gz
            desktop/app/release/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, core-mac, apk, ios, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: 整理文件
        run: |
          mkdir release
          cp out/desktop-*/* release/
          cp out/apk/p2d.apk "release/P2D-${GITHUB_REF_NAME#v}-android.apk"
          cp out/ios/p2d-unsigned.ipa "release/P2D-${GITHUB_REF_NAME#v}-ios-unsigned.ipa"
          for d in out/core/*/ out/core-mac/*/; do
            n=$(basename "$d")
            tar -czf "release/P2D-core-${GITHUB_REF_NAME#v}-$n.tar.gz" -C "$d" .
          done
          ls -la release
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
